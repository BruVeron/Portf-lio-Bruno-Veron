<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <!-- SDK oficial do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="center">
        <h1>Login</h1>

        <form onsubmit="logar(event)">
            <div class="txt_field">
                <input type="email" id="login" required>
                <label>Email</label>
            </div>

            <div class="txt_field">
                <input type="password" id="senha" required>
                <label>Senha</label>
            </div>

            <div class="pass">
                Esqueceu a senha?
            </div>

            <div id="mensagem"></div>

            <div class="botoes">
                <input type="submit" value="conectar" class="btn-conectar">
                <input type="button" value="cancelar" class="btn-cancelar" onclick="cancelar()">
            </div>

            <div class="signup_link">
                <a href="cadastro.html">Não é membro? Cadastre-se!</a>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
