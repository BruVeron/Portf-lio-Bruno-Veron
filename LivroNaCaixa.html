<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="LivroNaCaixa.css">
</head>
<body>
    <h1>Galeria de Imagens</h1>

    <div class="carrossel">

        <button class="seta esquerda" onclick="voltar()">&#10094;</button>

        <div class="imagens" id="imagens">

            <img src="img/LivroNaCaixa1.jpg" onclick="abrirImagem(this)">
            <img src="img/LivroNaCaixa2.jpg" onclick="abrirImagem(this)">
            <img src="img/LivroNaCaixa3.jpg" onclick="abrirImagem(this)">
            <img src="img/LivroNaCaixa4.jpg" onclick="abrirImagem(this)">
            <img src="img/LivroNaCaixa5.jpg" onclick="abrirImagem(this)">
            <img src="img/LivroNaCaixa6.jpg" onclick="abrirImagem(this)">

        </div>

        <button class="seta direita" onclick="avancar()">&#10095;</button>

    </div>


    <!-- TELA DA IMAGEM AMPLIADA -->

    <div class="modal" id="modal" onclick="fecharImagem()">

        <button class="fechar" onclick="fecharImagem()">&#10005;</button>

        <img id="imagemGrande" onclick="event.stopPropagation()">

    </div>

    <script src="LivroNaCaixa.js"></script>
</body>
</html>
