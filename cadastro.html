<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="center">

        <h1>
            Cadastro
        </h1>

        <form onsubmit="cadastrar(); return false">

            <div class="txt_field">

                <input type="text" id="emailCadastro" required>

                <label>Email</label>

            </div>


            <div class="txt_field">

                <input type="password" id="senhaCadastro" required>

                <label>Senha</label>

            </div>


            <div class="txt_field">

                <input type="password" id="confirmarSenha" required>

                <label>Confirmar senha</label>

            </div>


            <div id="mensagemCadastro"></div>


            <div class="botoes">

                <input
                    type="submit"
                    value="Cadastrar"
                    class="btn-conectar"
                >

                <input
                    type="button"
                    value="Cancelar"
                    class="btn-cancelar"
                    onclick="voltarLogin()"
                >

            </div>


            <div class="signup_link">

                <a href="index.html">
                    Já possui uma conta? Faça login!
                </a>

            </div>

        </form>

    </div>


    <script src="cadastro.js"></script>

</body>

</html>
